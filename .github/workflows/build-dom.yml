name: Build DOM

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check library, tests, and sample types
        run: |
          npx tsc -p packages/dom/tsconfig.lib.json --noEmit
          npx tsc -p packages/dom/tsconfig.spec.json --noEmit
          npx tsc -p samples/sandbox/tsconfig.app.json --noEmit
          npx tsc -p samples/sandbox-server/tsconfig.app.json --noEmit
      - run: npx vitest run --config packages/dom/vite.config.ts
      - run: npx vite build --config packages/dom/vite.config.ts
